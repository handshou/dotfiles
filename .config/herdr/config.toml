[keys]
prefix = "ctrl+a"
# Navigate panes spatially with arrow keys.
focus_pane_left = "prefix+left"
focus_pane_right = "prefix+right"
# Navigate tabs with both the Herdr defaults and h/l.
previous_tab = ["prefix+p", "prefix+h"]
next_tab = ["prefix+n", "prefix+l"]
# Cycle workspaces with uppercase H/L. Move the default pane-swap
# bindings away from those keys to avoid duplicate actions.
swap_pane_left = "prefix+alt+shift+left"
swap_pane_right = "prefix+alt+shift+right"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
# Prefix+D is reserved for the TODO popup below.
close_workspace = "prefix+alt+shift+d"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+shift+d"
type = "popup"
command = "if [ -e TODO.md ]; then exec nvim TODO.md; else exec nvim \"$HOME/Developer/TODO.md\"; fi"
description = "open TODO"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/workspace-sessionizer.sh"
description = "open or create project workspace"
width = "80%"
height = "70%"
